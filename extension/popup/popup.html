<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DopaQueue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup" role="main">

    <!-- Header -->
    <header class="popup__header">
      <span class="popup__logo" aria-label="DopaQueue">🌱 DopaQueue</span>
      <span class="popup__plant-status" id="plantStatus" aria-live="polite">
        <span class="popup__plant-emoji" id="plantEmoji" aria-hidden="true">🌱</span>
        <span id="plantLabel">thriving</span>
      </span>
    </header>

    <!-- Current tab + save -->
    <section class="card" aria-label="Current tab">
      <p class="popup__tab-title" id="tabTitle" title="">Loading current tab…</p>
      <button class="btn btn--primary" id="saveBtn" type="button">
        🌱 Save to DopaQueue
      </button>
      <p class="popup__feedback" id="feedback" aria-live="polite" role="status"></p>
    </section>

    <!-- Dopamine budget -->
    <section class="card" aria-label="Dopamine budget">
      <div class="budget__row">
        <span class="budget__label">Daily Budget</span>
        <span class="budget__coins" id="coins" aria-label="Coins">🪙 0</span>
      </div>
      <div class="budget__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="budgetBar">
        <div class="budget__bar-fill" id="budgetFill"></div>
      </div>
      <p class="budget__text" id="budgetText">— / — min left today</p>
    </section>

    <!-- Queue preview -->
    <section class="card" aria-label="Saved queue">
      <div class="queue-section__header">
        <span class="queue-section__label">Queue</span>
        <span class="queue-section__count" id="queueCount">0</span>
      </div>
      <div class="queue-list" id="queueList" role="list" aria-live="polite">
        <p class="queue-empty" id="queueEmpty">No videos saved yet</p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup__footer">
      <span class="popup__dashboard-link" id="dashboardLink"
            role="note" title="Web app coming soon">
        Open Dashboard →
      </span>
    </footer>

  </main>

  <script src="../lib/supabase.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
